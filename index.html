e Rekho, Pakhi… ♡",cards:[{label:"Trust",title:"I trust you, Samiya.",text:"Ami tomake trust kori, believe kori, ar tomar upor amar bishash ache. Amar overthinking kokhono tomar proti amar bishashke define kore na."},{label:"Comfort",title:"You deserve to feel safe with me.",text:"Ami chai na amar insecurity er jonno tumi nijeke question koro, amar bhalobasha niye doubt koro, ba nijeke kichu prove korar pressure feel koro."},{label:"Love",title:"You mean more to me than you know.",text:"Tumi amar kache onek important. Ami chai amar sathe tumi comfortable thako, loved feel koro, ar nijer moto kore hashte paro."}]},section4:{heading:"I'm Not Just Saying Sorry… ♡",subheading:"I want to show you through my actions.",promises:[{title:"Better Communication",text:"Ami kichu niye confused ba worried hole nijer moto overthink na kore tomar sathe shanto bhabe kotha bolar chesta korbo."},{title:"Managing My Insecurity",text:"Ami amar insecurity ar overthinking control korte shikhbo. Nijer thoughts er responsibility nebo, jate amar feelings er pressure tomar upor na pore."},{title:"Respecting Your Comfort",text:"Amar kono kaj ba behavior e tumi uncomfortable feel korle ami tomar feelings mon diye shunbo, bujhar chesta korbo, ar tomar boundaries respect korbo."},{title:"Proving It Through Actions",text:"Ami jani shudhu sorry bollei shobkichu thik hoye jay na. Tai ami amar behavior diye tomake bujhate chai je ami amar mistakes realize kori ar genuinely improve korte chai."}],closing:"Small changes, honest communication, and consistent effort — that's how I want to love you better."},letter:{heading:"My Dearest Samiya, ♡",greeting:"My dear sweetheart pakhi,",paragraphs:["I'm really sorry shob kichur jonno.","Ami chai na amar insecurity ar overthinking er jonno tumi kokhono nijeke question koro ba amar bhalobasha ar trust niye doubt koro. Tumi amar kache onek important, ar tomar feelings amar kache matter kore.","Ami jani amar intention kharap chilo na, but ami etao bujhi je amar behavior er impact tomar upor porte pare. Tai nijer intention explain korar pashapashi tomar feelings bujhte chaowa o amar responsibility.","Ami chai amader moddhe shobkichu bhalobasha, trust ar understanding diye thik thakuk. Kono unnecessary misunderstanding na, kono pressure na — just dujon manush, jara eke oporke bujhte ar ekshathe grow korte chay.","Ami perfect na, sweetheart. Amar mistakes ache, amar insecurity ache, ar majhe majhe ami overthink kore feli. But ami amar mistakes gulo realize korte chai, shegulo theke shikhte chai, ar nijeke aro bhalo korte chai.","I don't want you to believe my promises just because they sound beautiful. I want to earn your trust through my actions, patience, honesty, and the way I treat you every day.","Tumi amar kache special, Samiya. Tumi amar sweetheart pakhi, ar ami chai tumi amar sathe loved, respected, and comfortable feel koro.","I'm really sorry, my love.","I love you, my dear sweetheart pakhi. ❤️"],signoff:"Always with love,",signature:"Your Yousuf ♡",rereadButton:"Read My Letter Again"},memory:{heading:"A Little Memory of Us",text:"Different thoughts, imperfect moments, but one thing I genuinely want to protect — the love, trust, and understanding between us.",ribbon:"Samiya ♡ Yousuf",photoPlaceholders:3},final:{heading:"Ekta Chotto Request, Amar Pakhi… ♡",paragraphs:["Ami chai na tumi pressure feel kore amake forgive koro. Tomar feelings er jonno tomar shomoy neyar full right ache.","Jokhon tumi comfortable feel korbe, ami chai amra shanto bhabe kotha boli, eke oporke bujhi, ar ei misunderstanding ta ekshathe solve korar chesta kori.","I don't expect everything to become perfect in one moment. I just hope I can keep showing you, through my actions, how much you mean to me.","I'm sorry, Samiya.","I love you, my sweetheart pakhi. ❤️"],heartButton:"Send a Little Heart Back ♡",heartMessage:"No pressure, no expectations. Just a little heart, sent with love. ♡",rereadButton:"Read My Apology Again 💌",footer:"Made with all m
